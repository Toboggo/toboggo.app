<!--
  Toboggo UI icon sprite — filtres, équipements de jeu, services, navigation,
  actions, badges, back-office, catégories de signalement, + le monogramme
  logo (logo-pictogram / logo-pictogram-mono) en version recolorable.

  Source : artifact Cowork "Logo, couleurs & pictogrammes", exporté le
  29/08/2026. C'EST UN BROUILLON : plusieurs groupes ne sont pas validés par
  le fondateur (voir docs/identite-visuelle-formats.md, section "Points
  ouverts") — en particulier les catégories de signalement et le style
  back-office sont marqués comme des propositions dans l'artifact d'origine.
  Le logo carré/rond/illustré N'EST PAS ICI : ce sont les vrais fichiers dans
  docs/brand-assets/, utilisés via LogoMark/Logo (packages/design-system/src/
  components/Logo.tsx), pas ce sprite.

  Usage : injecter ce SVG une fois dans le DOM (voir Icon.tsx dans ce même
  dossier), puis référencer chaque icône par <svg><use href="#ic-xxx"/></svg>.
  Toutes les icônes UI (préfixe ic-) sont en `stroke="currentColor"` — leur
  couleur suit la couleur CSS du texte parent. Tailles de rendu recommandées :
  16px (chips denses), 20-24px (boutons de filtre, listes), 32-40px (fiche
  parc). Le logo-pictogram(-mono) est en 0 0 120 120 (proportions du T),
  currentColor pour le trait, boule fixe #FFB020 sauf en mono (tout
  currentColor, pour usage un-seul-ton/tampon).
-->
